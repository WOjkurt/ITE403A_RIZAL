<section class="students-section">
    <h2>Student List</h2>

    <div class="header-actions">
        <!-- Link to Add Student -->
        <a routerLink="/students/add" class="btn-add">+ Add New Student</a>
    </div>

    @for (student of students; track $index; let i = $index) {
    <div class="student-card" [class.highlighted]="student.isFavorite">
        <h3 class="student-name">
            <span>#{{ i + 1 }} {{ student.name }}</span>
            @if (student.active) {
            <span class="active-badge">[Active]</span>
            } @else {
            <span class="inactive-badge">[Inactive]</span>
            }
        </h3>

        <p class="student-info">{{ student.course }} • {{ student.year }}</p>

        <div class="card-actions">

            <a [routerLink]="['/students', student.id || (i + 1)]" class="btn-view">View Student</a>

            <button type="button" [class.favorited]="student.isFavorite" (click)="onFavoriteStudent(student)">
                {{ student.isFavorite ? '★ Favorited' : '☆ Favorite' }}
            </button>

            @if (student.active) {
            <button type="button" (click)="onEditStudent(student)">Edit</button>
            }

            <button type="button" (click)="onDeleteStudent(i)">Delete</button>
        </div>
    </div>
    } @empty {
    <div class="empty-state">
        <p>No students found</p>
    </div>
    }
</section>
